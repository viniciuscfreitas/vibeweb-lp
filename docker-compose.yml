services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vibe-web-lp
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8085}:80"
    networks:
      npm_default:
        aliases: [vibeweb, frontend]
    # Use 127.0.0.1 explicitly: BusyBox wget on Alpine resolves `localhost`
    # to ::1 first; nginx listens on IPv4 0.0.0.0 only -> connection refused.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  npm_default:
    external: true
