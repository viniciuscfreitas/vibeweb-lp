server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Generate relative Location headers so `/start` -> `/` does not jump
    # back to http:// when the host reverse-proxy is serving https://.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    error_page 404 /404.html;

    # Cache static assets aggressively (immutable per file hash on next iteration).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /start → home. The Instagram bio link points here so the next iteration
    # can swap this for a dedicated funnel without breaking the bio URL.
    location = /start {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
